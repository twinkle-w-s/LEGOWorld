[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legoworld"
version = "0.3.0"
description = "A small LEGO design, validation, visual-review and Studio export MCP server."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "brickagent==0.1.0",
    "bricknet==0.1.1",
    "pybullet==3.2.7",
    "mcp==1.30.0",
    "Pillow==12.3.0",
    "numpy>=2,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
legoworld = "legoworld.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
legoworld = ["catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
